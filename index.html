<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blockbound Studios — Premium Minecraft Ürünleri</title>
    <meta name="description" content="Blockbound Studios: Premium Minecraft ürünleri, eklentiler, kaynak paketleri ve araçlar." />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <meta property="og:title" content="Blockbound Studios — Premium Minecraft Ürünleri" />
    <meta property="og:description" content="Blockbound Studios: Premium Minecraft ürünleri, eklentiler, kaynak paketleri ve araçlar." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&display=swap&text=Yükleniyor." rel="stylesheet" />
    <style>
      #app-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #0e1322;
        transition: opacity 0.6s ease;
      }
      #app-loader.hide { opacity: 0; pointer-events: none; }
      #app-loader .loader-icon {
        position: relative; width: 150px; height: 150px;
        background: url(/loader-icon.png) center / contain no-repeat;
        filter: drop-shadow(0 0 24px hsl(210 100% 60% / 0.45));
      }
      #app-loader .loader-icon::after {
        content: ""; position: absolute; inset: 0;
        background-image: repeating-linear-gradient(45deg,
          hsl(210 100% 60%) 0px, hsl(190 100% 65%) 50px, hsl(175 90% 55%) 100px, hsl(220 100% 65%) 150px,
          hsl(265 90% 70%) 200px, hsl(290 95% 70%) 250px, hsl(230 100% 70%) 300px, hsl(195 100% 65%) 350px, hsl(210 100% 60%) 400px);
        background-size: 565.69px 565.69px;
        -webkit-mask: url(/loader-icon.png) center / contain no-repeat;
                mask: url(/loader-icon.png) center / contain no-repeat;
        mix-blend-mode: color;
        animation: loader-slide 4.4s linear infinite;
      }
      @keyframes loader-slide {
        from { background-position: 0 0; }
        to { background-position: 565.69px 0; }
      }
      #app-loader .loader-row { display: flex; align-items: center; }
      #app-loader .loader-icon { flex-shrink: 0; }
      #app-loader .loader-text {
        display: inline-block; overflow: hidden; white-space: nowrap;
        max-width: 0; margin-left: 0; opacity: 0;
        color: #e6edf7; font-family: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
        font-size: 1.75rem; font-weight: 800; letter-spacing: 0.01em;
        animation: loader-text-in 0.8s cubic-bezier(0.4,0,0.2,1) 0.6s forwards;
      }
      @keyframes loader-text-in {
        to { max-width: 260px; margin-left: 1.5rem; opacity: 1; }
      }
    </style>
  </head>

  <body>
    <div id="app-loader" aria-label="Yükleniyor"><div class="loader-row"><div class="loader-icon"></div><span class="loader-text">Yükleniyor..</span></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
