<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blockbound Studios — Premium Minecraft Ürünleri</title>
    <meta name="description" content="Blockbound Studios: Premium Minecraft ürünleri, eklentiler, kaynak paketleri ve araçlar." />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <meta property="og:title" content="Blockbound Studios — Premium Minecraft Ürünleri" />
    <meta property="og:description" content="Blockbound Studios: Premium Minecraft ürünleri, eklentiler, kaynak paketleri ve araçlar." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      #app-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #0e1322;
        transition: opacity 0.6s ease;
      }
      #app-loader.hide { opacity: 0; pointer-events: none; }
      #app-loader .loader-icon {
        width: 140px; height: 140px;
        background-image: linear-gradient(90deg,
          hsl(210 100% 60%), hsl(190 100% 65%), hsl(175 90% 55%), hsl(220 100% 65%),
          hsl(265 90% 70%), hsl(290 95% 70%), hsl(230 100% 70%), hsl(195 100% 65%), hsl(210 100% 60%));
        background-size: 200% 100%;
        -webkit-mask: url(/loader-icon.png) center / contain no-repeat;
                mask: url(/loader-icon.png) center / contain no-repeat;
        animation: loader-slide 2s linear infinite;
      }
      @keyframes loader-slide {
        from { background-position: 0% 50%; }
        to { background-position: -200% 50%; }
      }
    </style>
  </head>

  <body>
    <div id="app-loader" aria-label="Yükleniyor"><div class="loader-icon"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
