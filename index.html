<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blockbound Studios — Premium Minecraft Ürünleri</title>
    <meta name="description" content="Blockbound Studios: Premium Minecraft ürünleri, eklentiler, kaynak paketleri ve araçlar." />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <meta property="og:title" content="Blockbound Studios — Premium Minecraft Ürünleri" />
    <meta property="og:description" content="Blockbound Studios: Premium Minecraft ürünleri, eklentiler, kaynak paketleri ve araçlar." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      #app-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #0e1322;
        transition: opacity 0.6s ease;
      }
      #app-loader.hide { opacity: 0; pointer-events: none; }
      #app-loader .loader-icon {
        position: relative; width: 150px; height: 150px;
        background: url(/loader-icon.png) center / contain no-repeat;
        filter: drop-shadow(0 0 24px hsl(210 100% 60% / 0.45));
      }
      #app-loader .loader-icon::after {
        content: ""; position: absolute; inset: 0;
        background-image: repeating-linear-gradient(135deg,
          hsl(210 100% 60%) 0px, hsl(190 100% 65%) 25px, hsl(175 90% 55%) 50px, hsl(220 100% 65%) 75px,
          hsl(265 90% 70%) 100px, hsl(290 95% 70%) 125px, hsl(230 100% 70%) 150px, hsl(195 100% 65%) 175px, hsl(210 100% 60%) 200px);
        background-size: 282.84px 282.84px;
        -webkit-mask: url(/loader-icon.png) center / contain no-repeat;
                mask: url(/loader-icon.png) center / contain no-repeat;
        mix-blend-mode: color;
        animation: loader-slide 2.2s linear infinite;
      }
      @keyframes loader-slide {
        from { background-position: 0 0; }
        to { background-position: 282.84px 0; }
      }
    </style>
  </head>

  <body>
    <div id="app-loader" aria-label="Yükleniyor"><div class="loader-icon"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
